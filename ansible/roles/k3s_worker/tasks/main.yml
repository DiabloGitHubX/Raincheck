---
- name: Check if K3s agent is already installed
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: k3s_agent_version
  failed_when: false
  changed_when: false

- name: Install or upgrade K3s agent
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION={{ k3s_version }} \
      K3S_URL=https://{{ k3s_master_ip }}:6443 \
      K3S_TOKEN={{ k3s_token }} \
      sh -s - agent
  when: >
    k3s_agent_version.rc != 0 or
    k3s_version not in k3s_agent_version.stdout
  no_log: true

- name: Ensure K3s agent service is enabled and running
  ansible.builtin.systemd:
    name: "{{ k3s_agent_service_name }}"
    state: started
    enabled: true

- name: Display worker registration status
  ansible.builtin.debug:
    msg: "K3s agent {{ k3s_version }} installed on {{ inventory_hostname }}."