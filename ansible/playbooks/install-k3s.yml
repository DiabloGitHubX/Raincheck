---
- name: Wait for SSH connectivity
  hosts: k3s_cluster
  gather_facts: false
  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        timeout: 180
        delay: 10

- name: Install K3s master
  hosts: k3s_master
  become: true
  roles:
    - k3s_master

- name: Join K3s workers
  hosts: k3s_workers
  become: true
  vars:
    k3s_master_ip: "{{ hostvars[groups['k3s_master'][0]]['master_private_ip'] }}"
    k3s_token: "{{ hostvars[groups['k3s_master'][0]]['k3s_token'] }}"
  roles:
    - k3s_worker

- name: Retrieve K3s kubeconfig
  hosts: k3s_master
  become: true
  tasks:
    - name: Read K3s kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig_raw

    - name: Save kubeconfig locally
      ansible.builtin.copy:
        content: "{{ kubeconfig_raw.content | b64decode | replace('127.0.0.1', hostvars[inventory_hostname]['ansible_host']) }}"
        dest: "{{ playbook_dir }}/../../kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Display cluster access instructions
      ansible.builtin.debug:
        msg: |
          Raincheck K3s cluster installation completed.
          Configure access using:
          export KUBECONFIG={{ playbook_dir }}/../../kubeconfig

- name: Apply workload labels to Kubernetes nodes
  hosts: k3s_master
  become: true
  tasks:
    - name: Label Worker 1 for Argo CD workloads
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl label node ip-10-0-1-11 workload=argocd --overwrite
      changed_when: true

    - name: Label Worker 2 for Raincheck workloads
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s kubectl label node ip-10-0-1-12 workload=raincheck --overwrite
      changed_when: true
