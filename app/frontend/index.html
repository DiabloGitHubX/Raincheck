<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raincheck Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #eef4f8;
            color: #243447;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            width: 90%;
            max-width: 650px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #176b87;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .status {
            padding: 18px;
            background: #e8f7ee;
            border-radius: 10px;
            color: #18794e;
        }

        .status strong {
            display: block;
            margin-bottom: 6px;
        }

        footer {
            margin-top: 30px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="dashboard">
        <h1>Raincheck ☁️</h1>
        <p class="subtitle">Your minimal weather infrastructure dashboard</p>

        <section class="status">
            <strong>Frontend Status: Online</strong>
            The Raincheck dashboard is running successfully.
        </section>

        <footer>
            Powered by Nginx · Raincheck DevOps Project
        </footer>
    </main>
</body>
</html>
