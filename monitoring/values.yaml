
# ==================================================
# Prometheus Operator
# ==================================================
prometheusOperator:
  enabled: true

  nodeSelector:
    kubernetes.io/hostname: ip-10-0-1-10

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

  # ==================================================
  # Admission Webhooks - Certificate Management
  # ==================================================
  admissionWebhooks:
    enabled: true

    patch:
      enabled: true
      ttlSecondsAfterFinished: 300

# ==================================================
# Prometheus
# ==================================================
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1

    nodeSelector:
      kubernetes.io/hostname: ip-10-0-1-10

    retention: 24h

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

    # Ephemeral storage; no PVC.
    storageSpec: {}

  additionalServiceMonitors:
    - name: rabbitmq
      namespaceSelector:
        matchNames:
          - raincheck
      selector:
        matchLabels:
          monitoring: prometheus
      endpoints:
        - port: prometheus
          path: /metrics
          interval: 30s
          scheme: http

# ==================================================
# Grafana
# ==================================================
grafana:
  enabled: true
  replicas: 1

  nodeSelector:
    kubernetes.io/hostname: ip-10-0-1-11

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 200m
      memory: 512Mi

  persistence:
    enabled: false

# ==================================================
# Alertmanager
# ==================================================
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1

    nodeSelector:
      kubernetes.io/hostname: ip-10-0-1-10

    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 96Mi

    storage: {}

# ==================================================
# kube-state-metrics
# ==================================================
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  nodeSelector:
    kubernetes.io/hostname: ip-10-0-1-10

  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

# ==================================================
# Node Exporter
# ==================================================
nodeExporter:
  enabled: true

  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: false
    darwin:
      enabled: false

prometheus-node-exporter:
  nodeSelector:
    kubernetes.io/os: linux

  tolerations:
    - effect: NoSchedule
      operator: Exists

  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 50m
      memory: 48Mi
