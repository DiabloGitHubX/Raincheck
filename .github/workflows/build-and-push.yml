
name: Build and Push Raincheck Images

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/build-and-push.yml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/build-and-push.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: diablogithubx/raincheck

jobs:
  test:
    name: Python Lint, Tests and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/worker/requirements.txt

      - name: Install worker dependencies and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/worker/requirements.txt
          python -m pip install pytest ruff==0.17.3 pip-audit

      - name: Lint worker with Ruff
        run: ruff check app/worker/

      - name: Run worker unit tests
        run: python -m pytest app/worker/tests/ -v

      - name: Audit worker dependencies
        run: python -m pip_audit -r app/worker/requirements.txt

  build-scan-push:
    name: Build, Scan, Push and Update Helm
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          load: true
          push: false
          tags: raincheck-frontend:scan

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          load: true
          push: false
          tags: raincheck-backend:scan

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: ./app/worker
          load: true
          push: false
          tags: raincheck-worker:scan

      - name: Install Trivy
        run: |
          docker pull aquasec/trivy:0.69.3

      - name: Report all HIGH and CRITICAL vulnerabilities
        run: |
          for service in frontend backend worker; do
            echo "===== Trivy report: $service ====="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.69.3 \
              image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --format table \
              --exit-code 0 \
              "raincheck-$service:scan"
          done

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        run: |
          for service in frontend backend worker; do
            echo "===== Trivy security gate: $service ====="
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.69.3 \
              image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "raincheck-$service:scan"
          done

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push validated images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          for service in frontend backend worker; do
            target="${REGISTRY}/${IMAGE_PREFIX}-${service}:${IMAGE_TAG}"
            docker tag "raincheck-${service}:scan" "$target"
            docker push "$target"
          done

      - name: Update Helm image tags
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/raincheck/values.yaml")
          lines = path.read_text().splitlines(keepends=True)

          updated = set()
          section = None

          for index, line in enumerate(lines):
              if line and not line[0].isspace() and line.rstrip().endswith(":"):
                  section = line.rstrip()[:-1]

              if section in {"frontend", "backend", "worker"} and re.match(r"^\s+tag:", line):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = f'{indent}tag: "{os.environ["IMAGE_TAG"]}"\n'
                  updated.add(section)

          expected = {"frontend", "backend", "worker"}
          if updated != expected:
              raise RuntimeError(
                  f"Expected to update {expected}, updated: {updated}"
              )

          path.write_text("".join(lines))
          print(f"Updated all three image tags to {os.environ['IMAGE_TAG']}")
          PY

      - name: Verify Helm image tags
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          test "$(grep -c "tag: \"$IMAGE_TAG\"" helm/raincheck/values.yaml)" -eq 3
          grep -n -A 4 "image:" helm/raincheck/values.yaml

      - name: Commit and push Helm image updates
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- helm/raincheck/values.yaml; then
            echo "Helm image tags are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/raincheck/values.yaml
          git commit -m "chore: update Raincheck image tags to ${{ steps.vars.outputs.IMAGE_TAG }}"
          git push origin HEAD:main
