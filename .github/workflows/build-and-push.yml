
name: Build and Push Raincheck Images

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: diablogithubx/raincheck

jobs:
  build-and-push:
    name: Build, Push and Update Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./app/frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Update Helm image tags
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/raincheck/values.yaml")
          lines = path.read_text().splitlines(keepends=True)

          updated = set()
          section = None

          for index, line in enumerate(lines):
              if line and not line[0].isspace() and line.rstrip().endswith(":"):
                  section = line.rstrip()[:-1]

              if section in {"frontend", "backend"} and re.match(r"^\s+tag:", line):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[index] = f'{indent}tag: "{os.environ["IMAGE_TAG"]}"\n'
                  updated.add(section)

          if updated != {"frontend", "backend"}:
              raise RuntimeError(
                  f"Expected to update frontend and backend, updated: {updated}"
              )

          path.write_text("".join(lines))
          print(f"Updated frontend and backend image tags to {os.environ['IMAGE_TAG']}")
          PY

      - name: Verify Helm image tags
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.IMAGE_TAG }}
        run: |
          grep -q "tag: \"$IMAGE_TAG\"" helm/raincheck/values.yaml
          test "$(grep -c "tag: \"$IMAGE_TAG\"" helm/raincheck/values.yaml)" -eq 2
          grep -n -A 4 "image:" helm/raincheck/values.yaml

      - name: Commit and push Helm image updates
        run: |
          if git diff --quiet -- helm/raincheck/values.yaml; then
            echo "Helm image tags are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/raincheck/values.yaml
          git commit -m "chore: update Raincheck image tags to ${{ steps.vars.outputs.IMAGE_TAG }}"
          git push origin HEAD:main
