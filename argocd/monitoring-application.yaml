
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  sources:
    # Prometheus Community Helm chart.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "92.17.0"
      helm:
        skipCrds: true
        valueFiles:
          - $values/monitoring/values.yaml

    # Raincheck repository containing our Helm values.
    - repoURL: https://github.com/DiabloGitHubX/Raincheck.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # Ignore annotation-only differences on the seven affected rules.
  # Alert expressions, labels, and other fields are still compared.
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: PrometheusRule
      namespace: monitoring
      name: monitoring-kube-prometheus-etcd
      jsonPointers:
        - /metadata/annotations

    - group: monitoring.coreos.com
      kind: PrometheusRule
      namespace: monitoring
      name: monitoring-kube-prometheus-general.rules
      jsonPointers:
        - /metadata/annotations

    - group: monitoring.coreos.com
      kind: PrometheusRule
      namespace: monitoring
      name: monitoring-kube-prometheus-k8s.rules.container-cpu-usage-second
      jsonPointers:
        - /metadata/annotations

    - group: monitoring.coreos.com
      kind: PrometheusRule
      namespace: monitoring
      name: monitoring-kube-prometheus-k8s.rules.container-memory-cache
      jsonPointers:
        - /metadata/annotations

    - group: monitoring.coreos.com
      kind: PrometheusRule
      namespace: monitoring
      name: monitoring-kube-prometheus-k8s.rules.container-memory-rss
      jsonPointers:
        - /metadata/annotations

    - group: monitoring.coreos.com
      kind: PrometheusRule
      namespace: monitoring
      name: monitoring-kube-prometheus-k8s.rules.container-memory-working-s
      jsonPointers:
        - /metadata/annotations

    - group: monitoring.coreos.com
      kind: PrometheusRule
      namespace: monitoring
      name: monitoring-kube-prometheus-kube-apiserver-histogram.rules
      jsonPointers:
        - /metadata/annotations

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
