# Schedule ArgoCD components on Worker 1.
# Component-level nodeSelectors inherit this global setting
# unless explicitly overridden.
global:
  nodeSelector:
    workload: argocd

# Reduce controller concurrency to limit memory spikes
# during large application reconciliations.
configs:
  params:
    controller.status.processors: "10"
    controller.operation.processors: "5"

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

server:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

  service:
    type: ClusterIP

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 192Mi
    limits:
      cpu: 200m
      memory: 384Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 96Mi

notifications:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 96Mi
