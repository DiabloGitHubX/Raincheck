apiVersion: v1
kind: Service
metadata:
  name: {{ include "raincheck.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "raincheck.name" . }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "raincheck.name" . }}
    app.kubernetes.io/component: backend