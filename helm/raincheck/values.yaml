# Global application settings
nameOverride: ""
fullnameOverride: ""

# Frontend configuration
frontend:
  replicaCount: 2
  image:
    registry: ghcr.io
    repository: diablogithubx/raincheck-frontend
    tag: "a5207aa"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
  nodeSelector:
    workload: raincheck
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Backend configuration
backend:
  replicaCount: 1
  image:
    registry: ghcr.io
    repository: diablogithubx/raincheck-backend
    tag: "a5207aa"
    pullPolicy: IfNotPresent
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  nodeSelector:
    workload: raincheck
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Worker configuration
worker:
  replicaCount: 1
  image:
    repository: ghcr.io/diablogithubx/raincheck-worker
    tag: "a5207aa"
    pullPolicy: Always
  nodeSelector:
    workload: raincheck
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# RabbitMQ configuration
rabbitmq:
  enabled: true
  replicaCount: 1
  image:
    repository: rabbitmq
    tag: "3.13-management"
    pullPolicy: IfNotPresent
  service:
    amqpPort: 5672
    managementPort: 15672
    prometheusPort: 15692
  auth:
    existingSecret: raincheck-rabbitmq
    usernameKey: username
    passwordKey: password
  persistence:
    enabled: true
    size: 2Gi
    storageClass: local-path
  nodeSelector:
    workload: raincheck
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Redis configuration
redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: "7.4-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  nodeSelector:
    workload: raincheck
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi